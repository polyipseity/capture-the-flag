[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "capture-the-flag-e08d4599-4b1d-4b3d-82ac-8ef7551b9ad6"
version = "0.0.0"
requires-python = ">=3.14.0"
description = "Capture the flag"
license = { file = "LICENSE.txt" }
readme = "README.md"
dependencies = [
  "anyio>=4.12.0",
  "asyncer>=0.0.17",
  "uvloop>=0.22.0; platform_system != 'Windows'",
  "winloop>=0.5.0; platform_system == 'Windows'",
]

[dependency-groups]
dev = [
  "hypothesis>=6.151.0",
  "pytest>=9.0.0",
  "pytest-cov>=7.0.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.15.0",
  "ty>=0.0.31",
]

[tool.ty.environment]
python-platform = "all"

[tool.ty.rules]
all = "error"

[tool.ty.src]
exclude = [
  "**/node_modules",
  "**/__pycache__",
  "**/.*",
  ".venv",
  # Disable type checking for the competitions directory, as it contains many scripts and tools that are not intended to be type-checked.
  "competitions",
]

[tool.pytest.ini_options]
addopts = [
  "--cov=./",
  "--cov-report=term-missing",
  "--dist=loadscope",
  "-n=auto",
  "--strict-markers",
]
testpaths = [".agents/skills/**/tests_*", "tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 88
# Exclude the competitions directory from linting, as it contains many scripts and tools that are not intended to be linted.
extend-exclude = ["competitions"]

[tool.ruff.lint]
# Enable Pylint-derived rule that disallows imports outside module top-level
# (import-outside-top-level / PLC0415). Ruff 0.12.0+ provides this rule.
extend-select = ["I", "PLC0415"]

[tool.uv]
package = false
required-version = ">=0.9.0,<0.11.0"

[tool.uv.build-backend]
# Do not include any packages in the build, as this project is only a collection of tools and scripts.
module-name = []
source-include = ["py.typed"]

[tool.uv.workspace]
members = [
  "competitions/2024/1753CTF 2024",
  "competitions/2024/AmateursCTF 2024",
  "competitions/2024/b01lers CTF 2024",
  "competitions/2024/Incognito 5.0",
  "competitions/2024/jellyCTF",
  "competitions/2024/Pearl CTF",
  "competitions/2024/PolyU x NuttyShell Cybersecurity CTF 2024",
  "competitions/2024/R3CTF 2024",
]
